<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng nhập - Watch Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #181818;
        }

        .login-box {
            max-width: 450px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
        }

        h2 {
            text-align: center;
            color: #b8860b;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h2>ĐĂNG NHẬP</h2>

    {% for message in messages %}
        <div class="alert alert-info">
            {{ message }}
        </div>
    {% endfor %}

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-dark w-100">
            Đăng nhập
        </button>

    </form>

    <p class="text-center mt-3">

        Chưa có tài khoản?

        <a href="{% url 'register' %}">
            Đăng ký ngay
        </a>

    </p>

    <a href="{% url 'home' %}">
        Quay về trang chủ
    </a>

</div>

</body>
</html>
