<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng ký - Watch Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #181818;
        }

        .register-box {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
        }

        h2 {
            color: #b8860b;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="register-box">

    <h2>ĐĂNG KÝ TÀI KHOẢN</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-dark w-100">
            Đăng ký
        </button>

    </form>

    <p class="text-center mt-3">
        Đã có tài khoản?

        <a href="{% url 'login' %}">
            Đăng nhập
        </a>
    </p>

    <a href="{% url 'home' %}">
        Quay về trang chủ
    </a>

</div>

</body>
</html>
