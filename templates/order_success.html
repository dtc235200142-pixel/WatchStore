<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>Đặt hàng thành công</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container text-center py-5">

    <div class="card p-5">

        <h1 class="text-success">
            ĐẶT HÀNG THÀNH CÔNG!
        </h1>

        <p>Cảm ơn bạn đã mua hàng tại Watch Store.</p>

        <h4>Mã đơn hàng: #{{ order.id }}</h4>

        <p>Khách hàng: {{ order.full_name }}</p>

        <p>Địa chỉ: {{ order.address }}</p>

        <h4 class="text-danger">
            Tổng tiền: {{ order.total_amount }} VNĐ
        </h4>

        <p>Trạng thái: {{ order.get_status_display }}</p>

        <a href="/" class="btn btn-dark mb-2">
            Tiếp tục mua sắm
        </a>

        <a href="{% url 'orders' %}"
           class="btn btn-primary">
            Xem lịch sử đơn hàng
        </a>

    </div>

</div>

</body>
</html>
